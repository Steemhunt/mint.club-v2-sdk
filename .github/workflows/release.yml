name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify npm package and create release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify published package
        run: node scripts/publish-release.mjs --verify-tag "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Mint Club V2 SDK $GITHUB_REF_NAME" \
              --notes "$(printf '## Package\n\n- @mint.club/v2-sdk@%s' "$VERSION")" \
              --generate-notes
          fi
